# Database configuration
database:
  host: 35.219.25.99 # PostgreSQL server hostname
  port: 4455 # PostgreSQL server port
  user: odoo # PostgreSQL username
  password: Maneuver.Externalizations.Staked.6133 # PostgreSQL password
  dbname: beta # PostgreSQL database name
  sslmode: disable # SSL mode (disable, require, verify-ca, verify-full)

# Log configuration
log:
  level: info # Log level (debug, info, warn, error)
  format: console # Log format (console, json)

# Replication configuration
replication:
  publication: walstreamer_pub # PostgreSQL publication name
  slot: walstreamer_slot # PostgreSQL replication slot name
  schema_name: public # PostgreSQL schema name
  standby_timeout: 10 # Timeout for standby status updates (in seconds)
  initial_sync: true # Whether to perform initial table sync
  batch_size: 1000 # Number of changes to process in a batch

  # Reconnection settings for PostgreSQL
  reconnect:
    max_attempts: 0 # Maximum reconnection attempts (0 means unlimited)
    initial_delay: 1 # Initial delay between reconnection attempts (in seconds)
    max_delay: 30 # Maximum delay between reconnection attempts (in seconds)

  # List of tables to replicate with their configurations
  tables:
    account_move_line:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: account_move_line
      columns:
        - id
        - name
        - date
        - account_id
        - display_type
        - date_maturity
        - amount_residual
        - move_id
        - balance
        - debit
        - credit
        - property_unit_id
        - partner_id

    account_account:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: account_account
      columns:
        - id
        - code
        - name
        - account_type

    res_partner:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: res_partner
      columns:
        - id
        - name
        - email
        - phone

    account_move:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: account_move
      columns:
        - id
        - name
        - unit_id
        - state
        - payment_state
        - move_type
        - is_deposit_allocated
        - partner_id

    account_journal:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: account_journal
      columns:
        - id
        - name
        - type

    account_partial_reconcile:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: account_partial_reconcile
      columns:
        - id
        - debit_move_id
        - credit_move_id
        - amount
        - max_date

    propertek_property_unit:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: propertek_property_unit
      columns:
        - id
        - name
        - floor

    propertek_property_tower:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: propertek_property_tower
      columns:
        - id
        - name

    propertek_property:
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: propertek_property
      columns:
        - id
        - name
        - code

# Message broker configuration
broker:
  type: pubsub # Broker type (Options: inmemory, nats, pubsub)
  topic: dev_beta # Default topic name (used for tables without specific topic)

  # Google Cloud Pub/Sub specific configuration
  pubsub:
    project_id: proper-labs # Google Cloud project ID
    topic_prefix: poc_dev_beta # Prefix for auto-generated topics
    credentials_file: ./credentials.json # Path to Google Cloud service account JSON key file
    auto_create_topic: false # Automatically create topics if they don't exist
    location: asia-southeast1 # Location for BigQuery tables

# LSN (Log Sequence Number) persistence configuration
lsn:
  type: file # LSN storage type (file, postgres)
  path: ./history # Path to LSN storage file
  persist_interval: 5s # How often to persist LSN to storage (in seconds)

# Storage configuration
storage:
  type: file # Storage type (file)
  path: ./history # Path to storage directory
