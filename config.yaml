database:
  host: Cosmic-Echo.local
  port: 5432
  user: guest
  password: guest
  dbname: local
  sslmode: disable

replication:
  publication_name: walstreamer_pub
  slot_name: walstreamer_slot
  standby_timeout: 10 # in seconds
  tables:
    - public.inventory
  default_ops:
    - INSERT
    - UPDATE
    - DELETE
  table_configs:
    - name: public.inventory
      operations: ["INSERT", "UPDATE", "DELETE"]
  reconnect:
    max_attempts: 0  # 0 means unlimited
    initial_delay: 1  # in seconds
    max_delay: 30    # in seconds
  initial_sync: true
  batch_size: 1000

broker:
  type: nats
  hosts:
    - nats://Cosmic-Echo.local:4222
  topic: walstreamer.changes
  username: ""
  password: ""

lsn:
  type: file
  path: /tmp/walstreamer/lsn
  persist_interval: 5s

log:
  level: debug
  format: console

storage:
  type: file
  path: /tmp/walstreamer
