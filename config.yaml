# Database configuration
database:
  schema: public
  host: Cosmic-Echo.local # PostgreSQL server hostname
  port: 5432 # PostgreSQL server port
  user: guest # PostgreSQL username
  password: guest # PostgreSQL password
  dbname: local # PostgreSQL database name
  sslmode: disable # SSL mode (disable, require, verify-ca, verify-full)

# Log configuration
log:
  level: info # Log level (debug, info, warn, error)
  format: console # Log format (console, json)

# Replication configuration
replication:
  publication_name: walstreamer_pub # PostgreSQL publication name
  slot_name: walstreamer_slot # PostgreSQL replication slot name
  standby_timeout: 10 # Timeout for standby status updates (in seconds)

  # List of tables to replicate with their configurations
  tables:
    - name: inventory
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: inventory # Topic for this table's changes
      columns: ["id", "product_name", "unit_price"]
    - name: users
      operations: ["INSERT", "UPDATE", "DELETE"]
      topic: users # Topic for this table's changes

  # Default operations if not specified in table config
  default_ops:
    - INSERT
    - UPDATE
    - DELETE

  # Reconnection settings for PostgreSQL
  reconnect:
    max_attempts: 0 # Maximum reconnection attempts (0 means unlimited)
    initial_delay: 1 # Initial delay between reconnection attempts (in seconds)
    max_delay: 30 # Maximum delay between reconnection attempts (in seconds)

  initial_sync: true # Whether to perform initial table sync
  batch_size: 1000 # Number of changes to process in a batch

# Message broker configuration
broker:
  # Broker type (Options: inmemory, nats, pubsub)
  # - inmemory: In-memory broker for testing
  # - nats: NATS message broker
  # - pubsub: Google Cloud Pub/Sub
  type: pubsub

  # NATS specific configuration
  # Required when type is "nats"
  hosts:
    - nats://Cosmic-Echo.local:4222
  topic: sugeng_poc # Default topic name (used for tables without specific topic)
  username: "" # Optional NATS username
  password: "" # Optional NATS password
  write_metadata: false # Whether to write metadata to bigquery

  # Google Cloud Pub/Sub specific configuration
  # Required when type is "pubsub"
  pubsub:
    project_id: "proper-labs" # Google Cloud project ID
    topic_prefix: "poc_local" # Prefix for auto-generated topics (e.g., walstreamer-inventory)
    credentials_file: "./credentials.json" # Path to Google Cloud service account JSON key file
    auto_create_topic: false # Automatically create topics if they don't exist
    location: "asia-southeast1" # Location for BigQuery tables

# LSN (Log Sequence Number) persistence configuration
lsn:
  type: file # LSN storage type (file, postgres)
  path: /tmp/walstreamer/lsn # Path to LSN storage file (required when type is "file")
  persist_interval: 5s # How often to persist LSN to storage (in seconds)

# Storage configuration
storage:
  type: file # Storage type (file)
  path: /tmp/walstreamer # Path to storage directory (required when type is "file")
