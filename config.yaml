database:
  host: Cosmic-Echo.local
  port: 5432
  user: guest
  password: guest
  dbname: local
  sslmode: disable

replication:
  slot_name: walstreamer_slot
  publication_name: walstreamer_pub
  default_ops: ["INSERT", "UPDATE", "DELETE"]
  tables:
    - public.inventory
  table_configs:
    - name: public.inventory
      operations: ["INSERT", "UPDATE", "DELETE"]
  standby_timeout: 10
  initial_sync: true
  batch_size: 1000

broker:
  type: nats
  hosts:
    - nats://localhost:4222
  topic: walstreamer.changes
  username: ""
  password: ""

lsn:
  type: file
  path: /tmp/walstreamer/lsn
  persist_interval: 5s

log:
  level: info
  format: console

storage:
  type: file
  path: /tmp/walstreamer
